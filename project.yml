name: RepPilot
options:
  bundleIdPrefix: com.repilot
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "23"
    DEVELOPMENT_TEAM: "Y2HHD36TDG"

schemes:
  RepPilot:
    build:
      targets:
        RepPilot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RepPilotTests
        - RepPilotUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  RepPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RepPilot
    resources:
      - path: RepPilot/Resources
    entitlements:
      path: RepPilot/RepPilot.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: RepPilot/Resources/Info.plist
      properties:
        CFBundleName: "REPILOT"
        CFBundleDisplayName: "REPILOT"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "REPILOT reads your workout data to sync activities from Apple Health and Apple Watch."
        NSHealthUpdateUsageDescription: "REPILOT saves your workouts to Apple Health."
        NSPhotoLibraryUsageDescription: "REPILOT accesses your photo library to attach activity photos."
        NSPhotoLibraryAddUsageDescription: "REPILOT saves workout share cards to your photo library."
        NSCameraUsageDescription: "REPILOT uses your camera to capture activity photos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Yiming Yang (Y2HHD36TDG)"
          PROVISIONING_PROFILE_SPECIFIER: "Rep Pilot App Store"
    dependencies:
      - target: RepPilotWatch
        embed: true

  RepPilotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RepPilotWatch
      - path: RepPilot/Shared
      - path: RepPilot/Models/ExerciseLibrary.swift
    entitlements:
      path: RepPilotWatch/RepPilotWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: RepPilotWatch/Info.plist
      properties:
        CFBundleName: "REPILOT Watch"
        CFBundleDisplayName: "REPILOT"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.repilot.rep-pilot
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes:
          - workout-processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "REPILOT uses HealthKit to record your live workout session on Apple Watch."
        NSHealthUpdateUsageDescription: "REPILOT saves the workout you record on Apple Watch to Apple Health."
        NSLocationWhenInUseUsageDescription: "REPILOT uses your location to record route, distance, and pace for outdoor workouts like running, walking, cycling, and hiking."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Yiming Yang (Y2HHD36TDG)"
          PROVISIONING_PROFILE_SPECIFIER: "Rep Pilot Watch App Store"

  RepPilotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RepPilotTests
    dependencies:
      - target: RepPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot-tests
        GENERATE_INFOPLIST_FILE: YES

  RepPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RepPilotUITests
    dependencies:
      - target: RepPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot-uitests
        GENERATE_INFOPLIST_FILE: YES
