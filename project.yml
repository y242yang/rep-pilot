name: RepPilot
options:
  bundleIdPrefix: com.repilot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  RepPilot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RepPilot
    resources:
      - path: RepPilot/Resources
    entitlements:
      path: RepPilot/RepPilot.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
    info:
      path: RepPilot/Resources/Info.plist
      properties:
        CFBundleName: "Rep Pilot"
        CFBundleDisplayName: "Rep Pilot"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Rep Pilot reads your workout data to sync activities from Apple Health and Apple Watch."
        NSHealthUpdateUsageDescription: "Rep Pilot saves your workouts to Apple Health."
        NSPhotoLibraryUsageDescription: "Rep Pilot accesses your photo library to attach activity photos."
        NSCameraUsageDescription: "Rep Pilot uses your camera to capture activity photos."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RepPilotTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RepPilotTests
    dependencies:
      - target: RepPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot-tests

  RepPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RepPilotUITests
    dependencies:
      - target: RepPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.repilot.rep-pilot-uitests
